<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portafolio</title>
    <style>
      :root {
        --bg: #0e0e0e;
        --beige: #d2b48c;
        --beige-soft: #bfae8f;
        --card: #151515;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: var(--bg);
        color: var(--beige);
        line-height: 1.6;
      }

      /* ===== HEADER ===== */
      header {
        position: fixed;
        top: 0;
        width: 100%;
        background: #1a1a1a;
        border-bottom: 1px solid #2a2a2a;
        z-index: 1000;
      }

      nav {
        width: 100%;
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      nav .left {
        display: flex;
        align-items: center;
      }

      nav .right {
        display: flex;
        gap: 2rem;
        list-style: none;
      }

      nav a {
        text-decoration: none;
        color: var(--beige);
        font-size: 0.9rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        transition: color 0.4s ease;
      }

      nav a:hover {
        color: var(--beige-soft);
      }

      section {
        max-width: 1100px;
        margin: auto;
        padding: 6rem 2rem 4rem;
        text-align: center;
      }

      .hero {
        padding-top: 9rem;
      }

      .hero h1 {
        font-size: clamp(2.5rem, 6vw, 4rem);
        letter-spacing: 2px;
      }

      .divider {
        width: 60px;
        height: 2px;
        background: var(--beige);
        margin: 1.5rem auto;
      }

      h2 {
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
      }

      .about p {
        max-width: 700px;
        margin: 0 auto;
        color: var(--beige-soft);
      }

      /* ===== SKILLS ===== */
      .skills {
        padding-top: 2rem;
      }

      .skills-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 2rem;
        margin-top: 2rem;
      }

      .skill {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8rem;
        transition: transform 0.3s ease;
      }

      .skill img {
        width: 55px;
        height: 55px;
        object-fit: contain;
      }

      .skill span {
        font-size: 0.9rem;
        color: var(--beige-soft);
      }

      .skill:hover {
        transform: translateY(-4px);
      }

      /* ===== PROYECTOS ===== */
      .projects-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 2rem;
        align-items: stretch;
      }

      .project-card {
        background: var(--card);
        border-radius: 20px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        height: 100%;
        transition:
          transform 0.5s ease-out,
          box-shadow 0.5s ease-out;
      }

      .project-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
      }

      .project-card img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        background: #0e0e0e;
        flex-shrink: 0;
        transition: transform 0.6s ease;
      }

      .project-card:hover img {
        transform: scale(1.03);
      }

      .project-content {
        padding: 1.2rem;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .project-content h3 {
        margin-bottom: 0.5rem;
        font-size: 1.1rem;
      }

      .project-content p {
        font-size: 0.9rem;
        color: var(--beige-soft);
      }

      .socials {
        display: flex;
        justify-content: center;
        gap: 3rem;
        padding-bottom: 5rem;
      }

      .socials a {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        color: var(--beige);
        text-decoration: none;
        font-size: 1rem;
        transition:
          opacity 0.4s ease,
          transform 0.4s ease;
      }

      .socials a:hover {
        opacity: 0.85;
        transform: translateY(-2px);
      }

      .socials svg {
        width: 28px;
        height: 28px;
        fill: var(--beige);
      }

      @media (max-width: 900px) {
        .projects-grid {
          grid-template-columns: 1fr;
        }

        .project-card img {
          height: 220px;
        }

        nav .right {
          gap: 1.2rem;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <nav>
        <div class="left">
          <strong>PORTAFOLIO</strong>
        </div>
        <ul class="right">
          <li><a href="#sobre-mi">Sobre mí</a></li>
          <li><a href="#proyectos">Proyectos</a></li>
          <li><a href="Curriculum.html" target="_blank">CV</a></li>
          <li><a href="#contacto">GitHub</a></li>
          <li><a href="#contacto">LinkedIn</a></li>
        </ul>
      </nav>
    </header>

    <section class="hero">
      <h1>Andrés Ruiz</h1>
      <div class="divider"></div>
    </section>

    <section id="sobre-mi" class="about">
      <h2>Sobre mí</h2>
      <p>Soy estudiante de 1º de Desarrollo de Aplicaciones Web (DAW)...</p>
    </section>

    <!-- NUEVA SECCIÓN TECNOLOGÍAS -->
    <section class="skills">
      <h2>Tecnologías</h2>
      <div class="skills-grid">
        <div class="skill">
          <img
            src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg"
          />
          <span>Python</span>
        </div>
        <div class="skill">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg" />
          <span>HTML</span>
        </div>
        <div class="skill">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg" />
          <span>CSS</span>
        </div>
        <div class="skill">
          <img
            src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg"
          />
          <span>JavaScript</span>
        </div>
        <div class="skill">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/php/php-original.svg" />
          <span>PHP</span>
        </div>
        <div class="skill">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mysql/mysql-original.svg" />
          <span>MySQL</span>
        </div>
      </div>
    </section>

    <!-- PROYECTOS (lo demás sigue igual) -->
  </body>
</html>
